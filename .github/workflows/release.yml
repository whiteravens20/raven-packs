name: publish

# Publishes the site, and cuts a GitHub Release when a tag asks for one.
#
# Two triggers, because the site has two kinds of content:
#
#   push to main   — republish the site. `site/` holds the launcher's news and
#                    announcement feeds, which are edited by hand; making a news
#                    correction wait for a pack release would be absurd.
#   tag <slug>-v*  — cut a GitHub Release for that one pack. Nothing else: the
#                    `github-pages` environment takes deployments from main
#                    only, and the commit being tagged is already on main, so
#                    its own push published the site moments earlier.
#
# Releasing is therefore two steps in this order: push to main, then tag.
#
# Two outputs, deliberately different in scope:
#
#   GitHub Release — the tagged pack only: .mrpack, client zip, server zip,
#                    manifest.json.
#   GitHub Pages   — *every* pack plus site/, because deploy-pages replaces the
#                    whole site. Publishing only one pack's dist/ would take
#                    every other pack's manifest offline, breaking the launcher
#                    for players who are not on the pack being released.
#
# Required secret:
#   PACK_SIGNING_KEY   base64 Ed25519 private key from `npm run keygen`.
#                      The job FAILS without it. A manifest decides which code
#                      lands on a player's machine; silently publishing one
#                      unsigned is the failure mode this is written to prevent.
on:
  push:
    branches:
      - main
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      slug:
        description: Pack slug to release (leave blank to republish the site only)
        required: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # An empty slug means "site only" and is a normal outcome, not a failure —
      # that is every push to main. A slug that names no pack is a failure.
      - name: Resolve pack slug
        id: meta
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            slug="$INPUT_SLUG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            # ravenclassic-v1.1.0 → ravenclassic
            slug="${GITHUB_REF_NAME%-v*}"
          else
            slug=""
          fi

          if [ -n "$slug" ] && [ ! -d "packs/$slug" ]; then
            echo "::error::No pack named '$slug' — expected packs/$slug/pack.json."
            exit 1
          fi

          # The tag says which version is being released; pack.json says which
          # version gets built, and it is the one that names the .mrpack. Left
          # unchecked they drift: a v1.0.0 release quietly containing
          # ravenclassic-1.1.1.mrpack. Only tags carry a version to compare —
          # workflow_dispatch names a pack, not a release.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME##*-v}"
            pack_version="$(node -e 'process.stdout.write(require(`./packs/${process.argv[1]}/pack.json`).version ?? "")' "$slug")"
            if [ "$tag_version" != "$pack_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME says version $tag_version, but packs/$slug/pack.json says ${pack_version:-<none>}. Bump one to match the other, then retag."
              exit 1
            fi
            echo "Version $tag_version matches packs/$slug/pack.json."
          fi

          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          if [ -n "$slug" ]; then
            echo "Releasing pack: $slug"
          else
            echo "No pack tagged — republishing the site only."
          fi

      # Every pack, not just the tagged one: they all go to Pages below, and a
      # pack with a stale lockfile would be republished from stale data.
      - name: Verify every lockfile is in sync
        run: node scripts/validate.mjs

      # Only the zips need the actual jars; keyed on the lockfiles so the cache
      # invalidates exactly when a mod set changes.
      - name: Cache downloaded mod jars
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: mods-${{ hashFiles('packs/*/pack.lock.json') }}
          restore-keys: mods-

      # The lockfile records which projects a mod depends on, never which
      # versions — Modrinth does not publish that. The requirement lives in each
      # jar's fabric.mod.json, so the only way to know a pack starts is to read
      # them. Skipping this once shipped a release that crashed Fabric Loader on
      # launch, which is a failure no amount of metadata validation can see.
      - name: Check mod dependencies resolve
        run: node scripts/check-deps.mjs

      # Order matters. buildPack wipes dist/<slug> before writing it, so the
      # tagged pack is built *last* — an all-packs pass afterwards would delete
      # the zips this release needs.
      #
      # PACK_BASE_URL is where the published overrides live, so the manifest's
      # configFiles[] point at real, fetchable URLs.
      - name: Build every pack (metadata only)
        env:
          PACK_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PACK_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
        run: node scripts/build.mjs

      - name: Rebuild the tagged pack with bundled jars
        if: steps.meta.outputs.slug != ''
        env:
          PACK_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PACK_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
        run: node scripts/build.mjs "${{ steps.meta.outputs.slug }}" --with-zip

      # Signing is not optional, and not conditional on the secret being
      # present: `${{ env.X }}` in a step-level `if:` cannot see that step's own
      # `env:` block, so the obvious guard silently skips signing forever.
      # sign.mjs verifies its own output before exiting, so reaching the next
      # step means every published manifest carries a signature that validates.
      - name: Sign every manifest
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
        run: |
          if [ -z "$PACK_SIGNING_KEY" ]; then
            echo "::error::secrets.PACK_SIGNING_KEY is not set. Refusing to publish unsigned manifests — run 'npm run keygen', then 'gh secret set PACK_SIGNING_KEY < keys/ravenpacks.key'."
            exit 1
          fi
          for manifest in dist/*/manifest.json; do
            node scripts/sign.mjs "$manifest"
          done

      # A pack that ships a beta mod is a beta pack, and saying so is the honest
      # part of publishing one. Two signals count and they catch different
      # things: `allowPrerelease` in the definition marks a mod whose only build
      # for this Minecraft version is a beta, while the version string catches a
      # mod that shipped a beta without us asking for one.
      #
      # Marking it by hand does not survive the next release, which is how
      # 1.5.2 went out as stable while carrying a JEI beta.
      - name: Decide the release channel
        id: channel
        if: steps.meta.outputs.slug != ''
        run: |
          node -e '
            const fs = require("fs");
            const dir = `packs/${process.argv[1]}`;
            const pack = JSON.parse(fs.readFileSync(`${dir}/pack.json`, "utf8"));
            const lock = JSON.parse(fs.readFileSync(`${dir}/pack.lock.json`, "utf8"));
            const asked = (pack.mods ?? []).filter((m) => m.allowPrerelease).map((m) => m.slug);
            const named = lock.files.filter((f) => /alpha|beta|snapshot|-rc/i.test(f.version)).map((f) => f.id);
            const beta = [...new Set([...asked, ...named])].sort();
            console.log(beta.length ? `prerelease — ${beta.join(", ")}` : "stable — no prerelease mods");
            // The title says what the pack is; the tag already says which tag it
            // is, so repeating it there tells a reader nothing. Left unset, the
            // action falls back to the tag name — which is how three releases
            // ended up titled "ravenclassic-v1.5.2" and friends.
            const title = `${pack.name} ${pack.version}${beta.length ? " — beta" : ""}`;
            console.log(`title — ${title}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${beta.length > 0}\ntitle=${title}\n`);
          ' "${{ steps.meta.outputs.slug }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' && steps.meta.outputs.slug != ''
        with:
          files: |
            dist/${{ steps.meta.outputs.slug }}/*.mrpack
            dist/${{ steps.meta.outputs.slug }}/*.zip
            dist/${{ steps.meta.outputs.slug }}/manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          name: ${{ steps.channel.outputs.title }}

      # Only main can deploy to Pages, so only main uploads the artifact — see
      # `deploy-pages` below for why the tag run does not.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/

  deploy-pages:
    # The `github-pages` environment only accepts deployments from main, so a
    # tag run reached this job solely to be rejected — the release was already
    # published and the run went red anyway. Skipping is not a workaround for
    # that rule but agreement with it: a tag names a commit that is already on
    # main, whose own push published the site seconds earlier, so the tag's
    # deployment was redundant even when it was allowed.
    #
    # The consequence for releasing: push to main first, tag second. A tag on a
    # commit main has not seen builds a release out of content the site is not
    # serving.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Publishing dist/ to Pages is what gives each pack a stable manifest URL:
      #   https://<owner>.github.io/<repo>/<slug>/manifest.json
      - id: deploy
        uses: actions/deploy-pages@v4
