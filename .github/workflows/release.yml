name: release

# Tag a pack release as <slug>-v<version>, e.g. ravenmc-v1.0.0.
on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      slug:
        description: Pack slug to release
        required: true
        default: ravenmc

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve pack slug
        id: meta
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            slug="${{ inputs.slug }}"
          else
            # ravenmc-v1.0.0 → ravenmc
            slug="${GITHUB_REF_NAME%-v*}"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Releasing pack: $slug"

      - name: Verify lockfile is in sync
        run: node scripts/validate.mjs "${{ steps.meta.outputs.slug }}"

      # Only the client zip needs the actual jars; keyed on the lockfile so the
      # cache invalidates exactly when the mod set changes.
      - name: Cache downloaded mod jars
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: mods-${{ hashFiles('packs/*/pack.lock.json') }}
          restore-keys: mods-

      # --with-zip bundles the jars for the launcher-free install path.
      # PACK_BASE_URL is where the published overrides live, so the manifest's
      # configFiles[] point at real, fetchable URLs.
      - name: Build pack
        env:
          PACK_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/build.mjs "${{ steps.meta.outputs.slug }}" --with-zip

      - name: Sign manifest
        if: ${{ env.PACK_SIGNING_KEY != '' }}
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
        run: node scripts/sign.mjs "dist/${{ steps.meta.outputs.slug }}/manifest.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ steps.meta.outputs.slug }}/*.mrpack
            dist/${{ steps.meta.outputs.slug }}/*.zip
            dist/${{ steps.meta.outputs.slug }}/manifest.json
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Publishing dist/ to Pages is what gives each pack a stable manifest URL:
      #   https://<owner>.github.io/<repo>/<slug>/manifest.json
      - id: deploy
        uses: actions/deploy-pages@v4
