name: validate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Structural checks plus one Modrinth lookup per entry — catches a broken
      # pack.json or a pinned version that was pulled, without downloading jars.
      - name: Validate pack definitions
        run: node scripts/validate.mjs

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache downloaded mod jars
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: mods-${{ hashFiles('packs/*/pack.json') }}
          restore-keys: mods-

      - name: Build all packs
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/
          retention-days: 14
