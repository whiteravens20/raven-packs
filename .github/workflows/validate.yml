name: validate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Offline: structure plus lockfile-in-sync. A pack.json edited without
      # re-running lock.mjs fails here instead of shipping a stale mod list.
      - name: Validate pack definitions and lockfiles
        run: node scripts/validate.mjs

      # Also offline — reads the lockfiles, emits manifest + .mrpack in
      # milliseconds. The client zip is skipped; only releases bundle jars.
      - name: Build packs (metadata only)
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/
          retention-days: 14

  # Separate, non-blocking: tells us when unpinned mods have newer releases
  # upstream, without failing anyone's pull request.
  check-updates:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Re-resolve against Modrinth
        run: node scripts/lock.mjs --update

      - name: Report drift
        run: |
          if git diff --quiet -- 'packs/*/pack.lock.json'; then
            echo "All packs are on the newest releases."
          else
            echo "::notice::Newer mod versions are available — run 'node scripts/lock.mjs --update' and commit."
            git diff --stat -- 'packs/*/pack.lock.json'
          fi
