name: validate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Offline: structure plus lockfile-in-sync. A pack.json edited without
      # re-running lock.mjs fails here instead of shipping a stale mod list.
      - name: Validate pack definitions and lockfiles
        run: node scripts/validate.mjs

      # Also offline — reads the lockfiles, emits manifest + .mrpack in
      # milliseconds. The client zip is skipped; only releases bundle jars.
      - name: Build packs (metadata only)
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs
          path: dist/
          retention-days: 14

  # Separate, and a report rather than a gate: it tells us when unpinned mods
  # have newer releases upstream, and when a newer release needs a mod the pack
  # does not have yet, without failing the commit it runs on. Each pack is
  # re-resolved by itself, so a pack that cannot move does not hide the others.
  # A pack that cannot be re-resolved for any other reason, such as Modrinth not
  # answering or a fault in lock.mjs, still fails the job.
  check-updates:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Re-resolve each pack against Modrinth
        run: |
          failed=0
          for dir in packs/*/; do
            slug=$(basename "$dir")
            log="$RUNNER_TEMP/lock-$slug.log"
            if node scripts/lock.mjs "$slug" --update > "$log" 2>&1; then
              # generatedAt moves with every lock, so it says nothing about the mods.
              if git diff --quiet -I '"generatedAt"' -- "packs/$slug/pack.lock.json"; then
                echo "$slug: every mod is on its newest release."
              else
                echo "::notice title=$slug::Newer mod versions are available. Run 'node scripts/lock.mjs $slug --update' and commit."
                git diff --stat -I '"generatedAt"' -- "packs/$slug/pack.lock.json"
              fi
            elif grep -q 'required dependencies are not in the pack' "$log"; then
              # lock.mjs will not lock a pack that lacks a mod a newer release
              # requires: news about upstream, decided on in the pack, not a fault here.
              missing=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -o 'missing required dependency: .*' || true)
              while read -r line; do
                [ -n "$line" ] && echo "::warning title=$slug::Its newest releases need a mod it does not have: ${line#missing required dependency: }"
              done <<< "$missing"
            else
              cat "$log"
              echo "::error title=$slug::lock.mjs could not re-resolve this pack."
              failed=1
            fi
          done
          exit "$failed"
