# White Ravens Classic — server defaults. Edit freely; this file is only written
# on first extraction, and the server rewrites it with any missing keys on first
# start.
motd=White Ravens Classic
max-players=5
view-distance=10
simulation-distance=8
difficulty=normal
allow-flight=false
spawn-protection=0

# Offline mode is deliberate, and it is only safe because EasyAuth is in the
# pack: players register a password and the server binds it to the name. Without
# that mod this line means anyone may log in as anyone.
online-mode=false
enforce-secure-profile=false

# The ravenclassic-rules datapack hands out the starter kit after a death and
# on /trigger rc_kit, and `/starterkit give` refuses anyone below admin level.
# Functions need to outrank an ordinary player for that to work. Players still
# cannot run the command themselves — the only way in is the /trigger.
function-permission-level=4
