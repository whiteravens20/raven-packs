# White Ravens Classic — server defaults. Edit freely; this file is only written
# on first extraction, and the server rewrites it with any missing keys on first
# start.
motd=White Ravens Classic
max-players=40
view-distance=10
simulation-distance=8
difficulty=normal
allow-flight=false
spawn-protection=0

# Offline mode is deliberate, and it is only safe because EasyAuth is in the
# pack: players register a password and the server binds it to the name. Without
# that mod this line means anyone may log in as anyone. Switch to true once
# Raven Forge's Microsoft sign-in is approved, and drop EasyAuth in the same
# change — not before.
online-mode=false
enforce-secure-profile=false

# The rank shop is a datapack that runs LuckPerms commands on the buyer's
# behalf, which needs functions to outrank an ordinary player. Level 4 is what
# `lp user ... parent add` requires; players still cannot run it themselves,
# because the only way in is the /trigger the datapack exposes.
function-permission-level=4
