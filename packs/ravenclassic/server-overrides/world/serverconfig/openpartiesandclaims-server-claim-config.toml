# Open Parties and Claims — konfiguracja działek SERWEROWYCH.
#
# Dotyczy wyłącznie działek postawionych w trybie serwerowym (spawn, market,
# arena). Działki graczy chodzą po openpartiesandclaims-default-player-config
# i tam paczka nie zmienia nic — każdy ustawia sobie swoją sam.
#
# PUŁAPKA. Linijka "version" musi tu być. Bez niej OPAC uznaje ten plik za
# obcy, kasuje go i wypisuje własne domyślne — po cichu, bez ostrzeżenia w
# logu. Sprawdzone: plik bez wersji wraca po pierwszym starcie do samych true.
# Po aktualizacji moda zajrzyj, czy cztery wartości niżej dalej stoją na false.
#
# Reszta opcji dopisze się sama przy pierwszym starcie — tak jak w pliku obok.

[playerConfig]
	version = 15

	[playerConfig.claims]
		[playerConfig.claims.protection]
			[playerConfig.claims.protection.exceptions]
				# The four exceptions OPAC keeps on true by default, which let
				# mobs onto a protected claim despite the protection. Turned off:
				# on a server claim nothing spawns — not hostile, not friendly,
				# not from a spawner block.
				#
				# This closes spawning only. A mob that walked in from outside is
				# the ravenclassic-rules datapack's business — see
				# docs/claims.txt, section 2b.
				naturalSpawnHostile = false
				naturalSpawnFriendly = false
				spawnersHostile = false
				spawnersFriendly = false
