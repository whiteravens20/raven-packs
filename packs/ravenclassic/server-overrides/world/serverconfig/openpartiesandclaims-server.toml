# Open Parties and Claims — White Ravens Classic
#
# Only the options the pack actually changes are written here. Everything else
# the mod fills in with its own defaults the first time the server starts, so
# do not be surprised when this file grows.
#
# maxPlayerClaims and maxPlayerClaimForceloads are read at world load, so a
# change here needs a server restart, not a /reload.

[serverConfig]
	# Where per-player claim and forceload limits come from. Without this the
	# mod looks for Prometheus and every LuckPerms group meta value is ignored.
	permissionSystem = "luck_perms"

	[serverConfig.claims]
		# The fallback for a player whose LuckPerms meta has not been read yet
		# — which is every player until their first login after a restart.
		# Keep these equal to the lowest rung of the ladder, never higher.
		maxPlayerClaims = 4
		maxPlayerClaimForceloads = 0

		# A player must stand within 5 chunks of the chunk they are claiming.
		# This is what stops someone claiming land they have never walked to.
		maxClaimDistance = 5

		# 90 days of not logging in and the claims are released. The default is
		# a year, which on a small server means the map fills with ghost towns.
		playerClaimsExpirationTime = 2160

		[serverConfig.claims.protection]
			# Everything inside a claim is closed to outsiders by default —
			# blocks, chests, doors, animals. These are the deliberate holes.
			# The list is global: it does not care whose claim the block
			# stands in, so it covers server claims (spawn, market) exactly
			# like a player's.
			#
			# The "anything$" prefix means "may be right-clicked whatever is
			# in the hand, still may not be broken". Without it the mod lets
			# the click through and then rejects the held item, so a customer
			# carrying a stack of dirt cannot open a shop — the interaction
			# a claim is meant to allow fails on a detail nobody would guess.
			# A sneaking player is deliberately excluded from the shortcut,
			# which is what keeps block placing protected.
			#
			# The shop's own settings screen stays owner-only, so an open shop
			# block is a till, not a back door.
			#
			# The crafting table is the mod's own default, left as it ships.
			#
			# The lectern is here so the guide on spawn can be read. It opens
			# the taking too, and no setting in this file can separate the two:
			# Modonomicon answers the right-click itself, reading and taking are
			# the same block interaction, and the "anything$" prefix and the
			# server-claim Lecterns group were both measured to change nothing.
			# The book is put back a second later instead, by the rc_pulpit
			# marker in the ravenclassic-rules datapack.
			#
			# Bare rather than "anything$", like everything else that is not a
			# shop. Bare does NOT mean "empty hand" — that is the "hand$"
			# prefix, per the mod's own documentation in this file. Bare means
			# the click goes through unless the held item is itself blocked by
			# itemUseProtectionExceptionList below, so a player carrying a
			# pickaxe is refused and one carrying the guide is not.
			#
			# That pairing is also what keeps this exception from opening a
			# hole. Measured on a live server: an item that IS an item-use
			# exception can be sneak-PLACED against a block exception inside
			# somebody else's claim. Nothing in the item list here is a
			# placeable block — the guide is a book — so there is nothing to
			# place. Do not add a placeable item to that list without
			# re-measuring this.
			forcedBlockProtectionExceptionList = [
				"minecraft:crafting_table",
				"minecraft:lectern",
				"anything$waystones:*",
				"anything$universal_shops:trade_block",
				"anything$universal_shops:admin_trade_block"
			]

			# Blocks are one protection, the item in your hand is another. The
			# mod disables most right-click item use inside a claim, and the
			# guide book is an item — so a player standing on spawn, which is a
			# server claim, was told to empty their hand instead of reading it.
			# A book that exists to be opened has to be an exception.
			#
			# The wildcard covers the coloured variants too. Nothing in this
			# namespace places, breaks or throws anything.
			itemUseProtectionExceptionList = [
				"modonomicon:*"
			]
