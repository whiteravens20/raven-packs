##                          ##
##         BlueMap          ##
##     Webserver-Config     ##
##                          ##

# Shipped by the pack, so BlueMap never generates its own version of this file.
# Only `port` differs from BlueMap's defaults; the rest is written out verbatim
# because a generated file would have replaced this one wholesale.

# With this setting you can disable the integrated webserver.
# Default is true
enabled: true

# The webroot that the server will host to the web.
# Must match webapp.conf, which the pack leaves at its default.
webroot: "bluemap/web"

# The port that the webserver listens to.
#
# BlueMap's own default is 8100. 25566 only reads as "next to Minecraft"
# because 25565 is the vanilla port — this server answers on 32909, which is a
# host-allocated port, and allocations are the whole point: a rented panel
# routes a fixed set and nothing else. A port the host has not allocated
# listens to nobody and fails silently, so confirm 25566 is open in the panel
# before concluding the map is broken.
port: 25566

# Whether to use Server-Sent Events (SSE) for pushing tile and marker-updates
# to the connected clients.
# Default is true
sse-enabled: true

# Webserver activity logging is deliberately left off.
#
# BlueMap's generated config enables it, and its log format records the source
# address of every request — visitor IP addresses, written to disk on a public
# map nobody has to log in to see. Omitting the `log` block is BlueMap's own
# documented way to disable it ("Comment out to disable the logging
# completely"). Add it back if you ever need to debug the webserver.
