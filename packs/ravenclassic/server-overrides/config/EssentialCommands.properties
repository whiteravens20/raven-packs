# Essential Commands — White Ravens Classic
#
# Only the options the pack changes. The mod writes the rest of its defaults
# into this file on first start.

# Without this every Essential Commands feature falls back to "op or nobody"
# and LuckPerms has nothing to grant. Nothing in dokumentacja/rangi.txt works
# until this is true.
use_permissions_api=true

# Each number becomes a permission node: essentialcommands.home.limit.1 and so
# on up the ladder. Grant exactly one of them per group — and never the bare
# essentialcommands.home node, which LuckPerms reads as a wildcard and quietly
# hands the player the largest number in this list.
home_limit=1,2,3

# A player holding none of those nodes gets 1 home instead of 0, so a missed
# permission is an inconvenience rather than a locked-out player.
grant_lowest_numeric_by_default=true
