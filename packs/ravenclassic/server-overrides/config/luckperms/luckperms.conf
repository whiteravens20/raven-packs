# LuckPerms — White Ravens Classic
#
# Only the options the pack changes. LuckPerms uses its own defaults for
# everything left out, so this file stays short on purpose.

# Makes the arguments of a LuckPerms command part of the permission node:
# "/lp user X promote rangi" then needs luckperms.user.promote.rangi.<grupa>.
# This is what keeps a Moderator on the player ladder and away from staff
# groups. Without it, anyone who may promote may promote to anything.
#
# The catch: with this on, every LuckPerms command also demands
# luckperms.usecontext.global. Miss that one node and the command answers
# "no permission" without ever telling you which node was missing.
# dokumentacja/rangi.txt grants it.
argument-based-command-permissions = true
