# Vein mining takes up to 128 ore blocks in one swing, which is a month of the
# mining dimension's ore budget in an afternoon. Open Parties and Claims does
# stop it inside a claim — MekanismUtils fires a real BreakEvent per block —
# so this is about the pack's economy, not about protection.
#
# Only the keys we change are listed. NeoForge fills the rest in from the mod's
# own defaults on first load and rewrites the file with them, so this stays a
# statement of intent rather than a copy that goes stale.

[atomic_disassembler]
	#Enable the 'Vein Mining' mode for the Atomic Disassembler. This mode is limited to vein mining just ores and logs.
	veinMining = false
