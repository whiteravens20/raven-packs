# LuckPerms — White Ravens Forge
#
# Only the options the pack changes. LuckPerms uses its own defaults for
# everything left out, so this file stays short on purpose — measured: the
# server boots on a one-line file and logs "Loading storage provider... [YAML]".

# H2 is the LuckPerms default and it is a binary database: the rank ladder
# would exist only on whichever machine ran the setup commands, and no diff
# would ever show it changing. YAML puts groups and tracks in flat files the
# pack can ship and a reviewer can read.
#
# What this does NOT make safe: the server zip is extracted over a live server,
# so re-extracting resets every file below to the pack's version. Groups and
# tracks are pack content and that is the intent. Player data is not — it lands
# in yaml-storage/users/, which the pack deliberately never ships.
storage-method = "yaml"
