# White Ravens Forge — server defaults. Edit freely; this file is only written
# on first extraction, and the server rewrites it with any missing keys on first
# start.
motd=White Ravens Forge
max-players=15

# Lower than Classic on purpose. A tech server's load is not draw distance, it
# is the machines: Mekanism multiblocks, AE2 autocrafting and Industrial
# Foregoing farms all tick whether anyone is looking at them. Chunks that stay
# simulated are what costs, so the simulation radius is the number to keep tight
# and the view radius the one players actually notice.
view-distance=8
simulation-distance=6

difficulty=normal

# Unlike Classic, this must be true. Mekanism jetpacks and free runners, Ender
# IO's travel gear and half a dozen other mods give flight as ordinary
# progression; with this false the server kicks the player who earned it for
# "flying is not enabled on this server".
allow-flight=true
spawn-protection=0

# Offline mode is deliberate, and it is only safe with an authentication mod in
# the pack: players register a password and the server binds it to the name.
# Nothing in this pack does that yet — see the plan. Until one is chosen, this
# server must not be exposed to the internet.
online-mode=false
enforce-secure-profile=false
